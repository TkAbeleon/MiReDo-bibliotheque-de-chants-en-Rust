[package]
name = "miredo"
version = "0.1.0"
edition = "2024"
description = "Bibliothèque de chants de bureau MiReDo"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
hayro = "0.8.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
